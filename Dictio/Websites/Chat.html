<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #2b2a33;
    }
    .message-container {
      margin-bottom: 8px;
    }
    .message {
      font-family: "Montserrat";
      font-size: 23px;
      animation: fadeIn 1s ease;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 6px;
      max-width: 450px;
      display:inline-block;
      padding-top: 5px;
      padding-bottom: 5px;
      padding-left: 10px;
      padding-right: 10px;
    }
    .fade-in {
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .username {
      font-weight: bold;
    }
    .message-text {
      color: rgba(255, 255, 255, 0.9);
      overflow-wrap: break-word;
    }
    .fade-out {
      animation: fadeOut 0.5s ease forwards;
    }
    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }
      to {
        opacity: 0;
        transform: translateX(-10px);
      }
    }
    .followerImg {
      width: 15rem;
      display: block;
      margin: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div>
    <div style="width: 100%; display: none" 
         id="FollowerContainer"
         class="fade-in">
      <img src="https://i.gifer.com/origin/de/dea8f93fb360e56d2a55f6612a8943f3_w200.gif" 
           class="followerImg" />
      <div class="message-text" 
           style="text-align: center; font-size: 2rem">
        <span id="FollowerUserName">MizeMauu</span> just followed
      </div>
    </div>
    <div style="width: 100%; display: none" 
         id="RaidContainer"
         class="fade-in">
      <img src="https://external-preview.redd.it/zR3UR3s886LUAIiN6m9a5RKHX2_hxJlclzot0ufjEiU.jpg?width=640&crop=smart&auto=webp&s=33a779759d3e9ed5dd74b3ff497ae2e80cd6dbbd" 
           class="followerImg" />
      <div class="message-text" 
           style="text-align: center; font-size: 2rem">
        <span id="RaidUserName"></span> raided with <span id="RaidViews"></span> Viewers!
      </div>
    </div>
    <div id="messagesContainer">
    </div>
  </div>
  <script>
    // Application state
    const state = {
      websocket: null,
      isConnected: false,
      reconnectAttempts: 0,
      maxReconnectAttempts: 5,
      reconnectDelay: 3000,
      websocketUrl: 'ws://127.0.0.1:9656/'
    }
    const messagesContainer = document.getElementById('messagesContainer')

    function renderRaid(message) {
      const container = document.getElementById('RaidContainer')
      const userName = document.getElementById('RaidUserName')
      const views = document.getElementById('RaidViews')
      userName.innerText = message.FromBroadcasterUserName
      views.innerText = message.Viewers
      container.style.display = 'unset'
      setTimeout(() => {
        container.classList.add('fade-out');
        const handleAnimationEnd = () => {
          container.classList.remove('fade-out');
          container.style.display = 'none';
          container.removeEventListener('animationend', handleAnimationEnd);
        };
        container.addEventListener('animationend', handleAnimationEnd);
      }, 10000);
    }

    function renderFollower(message) {
      const container = document.getElementById('FollowerContainer')
      const userName = document.getElementById('FollowerUserName')
      userName.innerText = message.UserName
      container.style.display = 'unset'
      setTimeout(() => {
        container.classList.add('fade-out');
        const handleAnimationEnd = () => {
          container.classList.remove('fade-out');
          container.style.display = 'none';
          container.removeEventListener('animationend', handleAnimationEnd);
        };
        container.addEventListener('animationend', handleAnimationEnd);
      }, 10000);
    }
    function renderMessage(message) {
      const messageEl = document.createElement('span');
      messageEl.className = 'message';

      // --- BADGES ---
      if (message.Badges && Array.isArray(message.Badges)) {
        message.Badges.forEach(badge => {
          const badgeImg = document.createElement('img');
          badgeImg.src = badge.Url;
          badgeImg.style.height = "18px";
          badgeImg.style.marginRight = "4px";
          messageEl.appendChild(badgeImg);
        });
      }

      // --- USERNAME ---
      const username = document.createElement('span');
      username.className = 'username';
      if (message.Color) {
        username.style.color = message.Color;
      } else {
        username.style.color = getRandomColor();
      }
      username.textContent = message.ChatterUserName || 'Unknown';
      messageEl.appendChild(username);

      // --- MESSAGE CONTENT ---
      const messageText = document.createElement('span');
      messageText.className = 'message-text';
      messageText.style.marginLeft = "0.5rem";

      message.Message.Fragments.forEach(fragment => {
        if (fragment.Type === "text") {
          const textNode = document.createTextNode(fragment.Text);
          messageText.appendChild(textNode);
        }
        else if (fragment.Type === "emote") {
          const emoteImg = document.createElement('img');
          // Twitch emote URL (requires emote id)
          emoteImg.src = `https://static-cdn.jtvnw.net/emoticons/v2/${fragment.Emote.ID}/default/dark/1.0`;
          emoteImg.alt = fragment.Text;
          emoteImg.style.height = "20px";
          emoteImg.style.verticalAlign = "middle";
          messageText.appendChild(emoteImg);
        }
        else if (fragment.Type === "mention" && fragment.mention) {
          const mentionSpan = document.createElement('span');
          mentionSpan.textContent = fragment.text;
          mentionSpan.style.color = "#00FFFF"; // highlight mentions
          messageText.appendChild(mentionSpan);
        }
      });

      messageEl.appendChild(messageText);

      const messageContainerEl = document.createElement('div');

      messageContainerEl.appendChild(messageEl);
      messageContainerEl.id = message.MessageId
      messageContainerEl.className = 'message-container';

      messagesContainer.insertBefore(messageContainerEl, messagesContainer.firstChild);

      setTimeout(() => {
        messageContainerEl.classList.add('fade-out');
        messageContainerEl.addEventListener('animationend', () => {
          messageEl.remove();
        });
      }, 120000);
    }
    function removeMessage(message) {
      var msgElement = document.getElementById(message.MessageId)
      if (msgElement == null) return
      msgElement.remove();
    }
    function getRandomColor() {
      var letters = '0123456789ABCDEF';
      var color = '#';
      for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }
    function handleIncomingMessage(data) {
      const parsedData = JSON.parse(data)
      console.log('parsedData', parsedData)
      switch (parsedData.EventType) {
        case 'TwitchChatMessage':
          renderMessage(parsedData)
          break
        case 'TwitchChatMessageDelete':
          removeMessage(parsedData)
          break
        case 'TwitchFollower':
          renderFollower(parsedData)
          break
        case 'TwitchRaid':
          renderRaid(parsedData)
          break
      }
    }
    function connectWebSocket() {
      if (state.isConnected) return
      state.reconnectAttempts = 0
      try {
        state.websocket = new WebSocket(state.websocketUrl)

        state.websocket.onopen = () => {
          state.isConnected = true
          state.reconnectAttempts = 0
        }
        state.websocket.onmessage = (event) => {
          handleIncomingMessage(event.data)
        }
        state.websocket.onclose = (event) => {
          state.isConnected = false
          if (!event.wasClean) {
            attemptReconnect()
          }
        }
        state.websocket.onerror = (error) => {
          console.error('WebSocket error:', error)
        }
      }
      catch (error) {
        console.error('WebSocket connection error:', error)
      }
    }
    function attemptReconnect() {
      if (state.reconnectAttempts < state.maxReconnectAttempts) {
        state.reconnectAttempts++

        setTimeout(() => {
          connectWebSocket()
        }, state.reconnectDelay)
      }
    }
    function init() {
      connectWebSocket()
    }
    document.addEventListener('DOMContentLoaded', init)
  </script>
</body>
</html>
